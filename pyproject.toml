[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-deploy-ops"
version = "0.1.0"
description = "Model deployment, evaluation and monitoring control plane"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ayush Gawai" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ml-deploy-ops = "ml_deploy_ops.cli:main"

[tool.setuptools.packages.find]
include = ["ml_deploy_ops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
